name: ros2-ci
on:
  push:
  pull_request:
jobs:
  humble-and-pinocchio:
    runs-on: ubuntu-22.04
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      MAKEFLAGS: -j2
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble
      - name: Install dependencies
        run: |
          source /opt/ros/humble/setup.bash
          rosdep update
          rosdep install --from-paths . --ignore-src --rosdistro humble -y
          python3 -m pip install --user jsonschema==4.23.0 typing_extensions==4.16.0
      - name: Build and test isolated workspace
        run: |
          source /opt/ros/humble/setup.bash
          ./scripts/test_ros2.sh
          source build/ros2/install/setup.bash
          ros2 run robot_identification_tools dataset_inspect --help
          ros2 run robot_identification_tools identification_artifact --help
      - name: Validate schemas and artifact bindings
        run: python3 utils/check_schemas.py
