name: arm-identification-ci
on:
  pull_request:
    paths:
      - .github/workflows/arm-identification-ci.yml
      - benchmarks/arm_identification/**
      - robot_identification/**
      - robot_identification_pinocchio/**
      - scripts/run_arm_identification.sh
  workflow_dispatch:
jobs:
  mujoco-arms:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CTEST_PARALLEL_LEVEL: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      MAX_JOBS: '2'
      RAYON_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chase6305/HumanoidAssets
          ref: 067393d2b63b7ffa5b022e847ef2f4436799ad70
          path: build/HumanoidAssets
          sparse-checkout: |
            /Engineai_PM01/urdf/robot.urdf
            /OpenArm/left_arm.urdf
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Eigen
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev
      - name: Build and verify identification on both arms
        run: |
          run_experiment() {
            ./scripts/run_arm_identification.sh --assets-root build/HumanoidAssets "$@"
          }
          run_experiment --output build/arms-clean --torque-noise-nm 0 --outlier-nm 0
          for seed in 20261124 11 29 47 71; do
            run_experiment --output "build/arms-noisy-$seed" --seed "$seed"
          done
          python benchmarks/arm_identification/check_experiment.py build/arms-clean/report.json build/arms-noisy-*/report.json
          run_experiment --acquisition rollout --output build/arms-rollout-clean --torque-noise-nm 0 --outlier-nm 0
          for seed in 11 71; do
            run_experiment --acquisition rollout --output "build/arms-rollout-noisy-$seed" --seed "$seed"
          done
          python benchmarks/arm_identification/check_experiment.py \
            build/arms-rollout-clean/report.json build/arms-rollout-noisy-*/report.json
          run_experiment --acquisition rollout --fit-input raw --raw-estimator local-cubic \
            --raw-window 9 --output build/arms-rollout-raw
          run_experiment --design-only --sample-count 161 --design-evaluations 120 --output build/arms-points
          build/arm-identification/venv/bin/python benchmarks/arm_identification/check_raw_preprocessing.py \
            build/arm-identification/benchmark/arm_identification build/arms-rollout-raw/report.json
          build/arm-identification/venv/bin/python benchmarks/arm_identification/check_points.py build/arms-points
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm-identification-reports
          path: build/arms-*/report.json
          if-no-files-found: ignore
